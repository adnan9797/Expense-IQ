<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpenseIQ — Personal Finance Dashboard</title>
  <link rel="stylesheet" href="./style2.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="brand">
        <span class="brand-mark">₹</span>
        <h1>ExpenseIQ</h1>
      </div>
      <a href="add-transaction.html" class="btn-primary" style="width: auto; margin-left: auto; text-decoration: none; padding: 0.5rem 1rem;">View History →</a>
    </nav>
  </header>

  <main>
    <section class="summary">
      <div class="card card-balance">
        <h3>Total Balance</h3>
        <p id="balance">₹0.00</p>
      </div>
      <div class="card card-income">
        <h3>Total Income</h3>
        <p id="income">₹0.00</p>
      </div>
      <div class="card card-expense">
        <h3>Total Expense</h3>
        <p id="expense">₹0.00</p>
      </div>
    </section>

    <section class="transaction-form">
      <h2 id="form-heading">Add New Transaction</h2>

      <form id="transaction-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="e.g. Groceries" autocomplete="off">
          <span class="error-message" id="title-error"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" placeholder="0.00">
          <span class="error-message" id="amount-error"></span>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
          </select>
          <span class="error-message" id="category-error"></span>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date">
          <span class="error-message" id="date-error"></span>
        </div>

        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="">Select type</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
          <span class="error-message" id="type-error"></span>
        </div>

        <button type="submit" class="btn-primary">Add Transaction & View History</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Developed by Md Adnan</p>
    <p>B.Tech CSE — Roll No:2428591 <em></em></p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
