<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History — ExpenseIQ</title>
  <link rel="stylesheet" href="./style2.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="brand">
        <span class="brand-mark">₹</span>
        <h1>ExpenseIQ</h1>
      </div>
      <a href="index.html" class="btn-primary" style="width: auto; margin-left: auto; text-decoration: none; padding: 0.5rem 1rem;">+ Add Transaction</a>
    </nav>
  </header>

  <main>
    <section class="filters">
      <div class="filter-group">
        <button type="button" class="filter-btn active" data-filter-type="all">All</button>
        <button type="button" class="filter-btn" data-filter-type="Income">Income</button>
        <button type="button" class="filter-btn" data-filter-type="Expense">Expense</button>
      </div>

      <div class="filter-group">
        <label for="category-filter" class="visually-hidden">Filter by category</label>
        <select id="category-filter">
          <option value="all">All categories</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Salary">Salary</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </section>

    <section class="transaction-history">
      <h2>Transaction History</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th>Type</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
            <!-- rows injected by add-transaction.js -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>Developed by Md Adnan</p>
    <p>B.Tech CSE — Roll No: <em></em></p>
  </footer>

  <script src="add-transaction.js"></script>
</body>
</html>
