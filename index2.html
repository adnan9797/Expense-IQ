<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpenseIQ — Personal Finance Dashboard</title>
  
  <!-- Bootstrap 5.3 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Overrides (Minimal styling needed) -->
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-light">

  <!-- Header / Navbar -->
  <header class="sticky-top bg-white border-bottom shadow-sm">
    <nav class="container d-flex align-items-center justify-content-between py-3">
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-primary fs-4 rounded-3 px-3 py-2">₹</span>
        <h1 class="h4 mb-0 fw-bold">ExpenseIQ</h1>
      </div>
      <a href="add-transaction.html" class="btn btn-primary fw-semibold">View History &rarr;</a>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="container my-4">
    
    <!-- Summary Cards Section -->
    <section class="row g-3 mb-4">
      <!-- Total Balance Card -->
      <div class="col-md-4">
        <div class="card border-0 shadow-sm border-start border-primary border-4 rounded-3 h-100">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted text-uppercase fw-bold fs-7">Total Balance</h6>
            <p class="card-text fs-2 fw-bold text-primary mb-0" id="balance">₹0.00</p>
          </div>
        </div>
      </div>

      <!-- Total Income Card -->
      <div class="col-md-4">
        <div class="card border-0 shadow-sm border-start border-success border-4 rounded-3 h-100">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted text-uppercase fw-bold fs-7">Total Income</h6>
            <p class="card-text fs-2 fw-bold text-success mb-0" id="income">₹0.00</p>
          </div>
        </div>
      </div>

      <!-- Total Expense Card -->
      <div class="col-md-4">
        <div class="card border-0 shadow-sm border-start border-danger border-4 rounded-3 h-100">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted text-uppercase fw-bold fs-7">Total Expense</h6>
            <p class="card-text fs-2 fw-bold text-danger mb-0" id="expense">₹0.00</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Transaction Form Section -->
    <section class="card border-0 shadow-sm rounded-3 p-4">
      <h2 class="h5 fw-bold mb-4">Add New Transaction</h2>
      
      <form id="transaction-form" class="row g-3">
        <!-- Title Input -->
        <div class="col-12">
          <label for="title" class="form-label text-uppercase text-muted fw-bold fs-7">Title</label>
          <input type="text" class="form-control rounded-3" id="title" name="title" placeholder="e.g. Groceries">
          <div class="text-danger small mt-1" id="title-error"></div>
        </div>

        <!-- Amount Input -->
        <div class="col-md-6">
          <label for="amount" class="form-label text-uppercase text-muted fw-bold fs-7">Amount</label>
          <input type="number" class="form-control rounded-3" id="amount" name="amount" placeholder="0.00">
          <div class="text-danger small mt-1" id="amount-error"></div>
        </div>

        <!-- Category Dropdown -->
        <div class="col-md-6">
          <label for="category" class="form-label text-uppercase text-muted fw-bold fs-7">Category</label>
          <select class="form-select rounded-3" id="category" name="category">
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
          </select>
          <div class="text-danger small mt-1" id="category-error"></div>
        </div>

        <!-- Date Input -->
        <div class="col-md-6">
          <label for="date" class="form-label text-uppercase text-muted fw-bold fs-7">Date</label>
          <input type="date" class="form-control rounded-3" id="date" name="date">
          <div class="text-danger small mt-1" id="date-error"></div>
        </div>

        <!-- Type Dropdown -->
        <div class="col-md-6">
          <label for="type" class="form-label text-uppercase text-muted fw-bold fs-7">Type</label>
          <select class="form-select rounded-3" id="type" name="type">
            <option value="">Select type</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
          <div class="text-danger small mt-1" id="type-error"></div>
        </div>

        <!-- Submit Button -->
        <div class="col-12 mt-4">
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">Add Transaction & View History</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="text-center text-muted border-top py-4 mt-5">
    <p class="mb-1">Developed by Md Adnan</p>
    <p class="mb-0">B.Tech CSE</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Logic JS -->
  <script src="main.js"></script>
</body>
</html>
