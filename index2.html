<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpenseIQ — Personal Finance Dashboard</title>
  
  <!-- Bootstrap 5.3 CS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-light">

  <!--  Navbar -->
  <header class="navbar-header sticky-top bg-white border-bottom shadow-sm">
    <nav class="container d-flex align-items-center justify-content-between py-3">
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-primary fs-4 rounded-3 px-3 py-2">₹</span>
        <h1 class="h4 mb-0 fw-bold">ExpenseIQ</h1>
      </div>
      <button type="button" class="history-btn btn btn-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#history-modal">
        View Transactions
      </button>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="container my-4">
    
    <!-- Summary Cards Section -->
    <section class="row g-3 mb-4">
      <!-- Total Balance Card -->
      <div class="col-md-4">
        <div class="summary-card card border-0 shadow-sm border-start border-primary border-4 rounded-3 h-100">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted text-uppercase fw-bold fs-7">Total Balance</h6>
            <p class="card-amount fs-2 fw-bold text-primary mb-0" id="balance">₹0.00</p>
          </div>
        </div>
      </div>

      <!-- Total Income Card -->
      <div class="col-md-4">
        <div class="summary-card card border-0 shadow-sm border-start border-success border-4 rounded-3 h-100">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted text-uppercase fw-bold fs-7">Total Income</h6>
            <p class="card-amount fs-2 fw-bold text-success mb-0" id="income">₹0.00</p>
          </div>
        </div>
      </div>

      <!-- Total Expense Card -->
      <div class="col-md-4">
        <div class="summary-card card border-0 shadow-sm border-start border-danger border-4 rounded-3 h-100">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted text-uppercase fw-bold fs-7">Total Expense</h6>
            <p class="card-amount fs-2 fw-bold text-danger mb-0" id="expense">₹0.00</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Transaction Form Section -->
    <section class="form-container card border-0 shadow-sm rounded-3 p-4">
      <h2 class="form-title h5 fw-bold mb-4">Add New Transaction</h2>
      
      <form id="transaction-form" class="row g-3">
        <!-- Title Input -->
        <div class="col-12">
          <label for="title" class="form-label text-uppercase text-muted fw-bold fs-7">Title</label>
          <input type="text" class="input-field form-control rounded-3" id="title" name="title" placeholder="e.g. Groceries">
          <div class="error-message text-danger small mt-1" id="title-error"></div>
        </div>

        <!-- Amount Input -->
        <div class="col-md-6">
          <label for="amount" class="form-label text-uppercase text-muted fw-bold fs-7">Amount</label>
          <input type="number" class="input-field form-control rounded-3" id="amount" name="amount" placeholder="0.00">
          <div class="error-message text-danger small mt-1" id="amount-error"></div>
        </div>

        <!-- Category Dropdown -->
        <div class="col-md-6">
          <label for="category" class="form-label text-uppercase text-muted fw-bold fs-7">Category</label>
          <select class="input-field form-select rounded-3" id="category" name="category">
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
          </select>
          <div class="error-message text-danger small mt-1" id="category-error"></div>
        </div>

        <!-- Date Input -->
        <div class="col-md-6">
          <label for="date" class="form-label text-uppercase text-muted fw-bold fs-7">Date</label>
          <input type="date" class="input-field form-control rounded-3" id="date" name="date">
          <div class="error-message text-danger small mt-1" id="date-error"></div>
        </div>

        <!-- Type Dropdown -->
        <div class="col-md-6">
          <label for="type" class="form-label text-uppercase text-muted fw-bold fs-7">Type</label>
          <select class="input-field form-select rounded-3" id="type" name="type">
            <option value="">Select type</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
          <div class="error-message text-danger small mt-1" id="type-error"></div>
        </div>

        <!-- Submit Button -->
        <div class="col-12 mt-4">
          <button type="submit" class="submit-btn btn btn-primary w-100 py-2 fw-semibold rounded-3">Add Transaction & View History</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer class="text-center text-muted border-top py-4 mt-5">
    <p class="mb-1">Developed by Md Adnan</p>
    <p class="mb-0">B.Tech CSE</p>
  </footer>

  <!-- Transaction History Modal -->
  <div class="modal " id="history-modal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="historyModalLabel">Transaction History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <!-- Filter-->
          <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <div class="btn-group" role="group">
              <button type="button" class="filter-btn btn btn-outline-primary active" data-filter-type="all">All</button>
              <button type="button" class="filter-btn btn btn-outline-primary" data-filter-type="Income">Income</button>
              <button type="button" class="filter-btn btn btn-outline-primary" data-filter-type="Expense">Expense</button>
            </div>

            <select id="category-filter" class="form-select w-auto">
              <option value="all">All categories</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Bills">Bills</option>
              <option value="Shopping">Shopping</option>
              <option value="Salary">Salary</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- History Table -->
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Title</th>
                  <th>Amount</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="transaction-list">
            
              </tbody>
            </table>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>

      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="main.js"></script>
</body>
</html>
